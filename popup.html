<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 320px;
        padding: 16px;
        margin: 0;
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #292929;
        color: #fff;
      }

      .button-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #fileInput {
        display: none;
      }

      .file-upload-label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: #424242;
        border: 1px solid #605e5c;
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s ease;
      }

      .file-upload-label:hover {
        background: #484848;
        border-color: #757575;
      }

      .selected-files {
        font-size: 12px;
        color: #c8c8c8;
        margin-top: -8px;
        margin-left: 16px;
      }

      button {
        display: flex;
        gap: 8px;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
      }

      #processButton {
        background: #6264a7;
        color: #fff;
      }

      #processButton:hover {
        background: #7174b4;
      }

      #testButton {
        background: #484848;
        color: #fff;
      }

      #testButton:hover {
        background: #535353;
      }

      #status {
        margin-top: 16px;
        padding: 12px;
        min-height: 20px;
        font-size: 13px;
        color: #c8c8c8;
        border-radius: 4px;
        background: #404040;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        max-height: 200px;
        overflow-y: auto;
        word-break: break-word;
        white-space: pre-wrap;
      }

      .status-success {
        color: #92c353;
        background: #2d3b21;
      }

      .status-error {
        color: #f25c5c;
        background: #3b2121;
      }

      .status-ready {
        color: #70b5f9;
        background: #212d3b;
      }

      .status-processing {
        color: #f9d770;
        background: #3b3521;
      }

      #statusIcon {
        display: flex;
        flex-shrink: 0;
      }

      #statusIcon svg {
        width: 14px;
        height: 14px;
      }

      .spin {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .divider {
        height: 1px;
        background: #484848;
        margin: 12px 0;
      }

      .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .subtle-button {
        background: transparent;
        color: #c8c8c8;
        border: none;
        font-size: 12px;
        cursor: pointer;
        padding: 10px;
        margin-top: 16px;
        text-align: center;
        width: 100%;
        opacity: 0.8;
        transition: opacity 0.2s;
      }

      .subtle-button:hover {
        opacity: 1;
      }

      .subtle-button .icon {
        width: 11px;
        height: 11px;
        margin-right: 4px;
        vertical-align: -1px;
      }
    </style>
  </head>
  <body>
    <div class="button-container">
      <label class="file-upload-label" for="fileInput">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
          />
        </svg>
        Choose Emoji Files
      </label>
      <input type="file" id="fileInput" multiple accept="image/*" />
      <div class="selected-files" id="selectedFiles">No files selected</div>

      <div class="divider"></div>

      <button id="processButton">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        Upload to Teams
      </button>
    </div>

    <div id="status">
      <span id="statusIcon"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="16" x2="12" y2="12" />
          <line x1="12" y1="8" x2="12.01" y2="8" /></svg
      ></span>
      <span id="statusText">Ready to process</span>
    </div>

    <button id="resetButton" class="subtle-button">
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="23 4 23 10 17 10" />
        <polyline points="1 20 1 14 7 14" />
        <path
          d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
        />
      </svg>
      Can't see your new emojis? Try refreshing Teams
    </button>

    <script src="dist/popup.js"></script>
  </body>
</html>
